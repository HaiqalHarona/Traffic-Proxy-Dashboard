version: '3.8'

networks:
  local-mesh:
    driver: bridge

services:
  traffic-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic-proxy-local
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PROXY_PORT=:80
      - PROXY_MAX_CONCURRENT=25
      - PROXY_QUEUE_TIMEOUT=500ms
      - DOCKER_POLL_INTERVAL=2s
      - LOG_LEVEL=DEBUG
      - DOCKER_HOST=unix:///var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    networks:
      - local-mesh

  backend-api:
    image: hashicorp/http-echo:0.2.3
    container_name: backend-api-local
    command: ["-text=OK: Response from backend-api (app.local)\n", "-listen=:5678"]
    labels:
      - "traffic-proxy.enable=true"
      - "traffic-proxy.rule=app.local"
      - "traffic-proxy.port=5678"
    networks:
      - local-mesh

  backend-slow:
    image: python:3.12-alpine
    container_name: backend-slow-local
    command:
      - python3
      - -c
      - |
        from http.server import HTTPServer, BaseHTTPRequestHandler
        import time
        class DelayedHandler(BaseHTTPRequestHandler):
            def do_GET(self):
                time.sleep(0.2)
                self.send_response(200)
                self.send_header('Content-Type', 'text/plain')
                self.end_headers()
                self.wfile.write(b"OK: Delayed response from backend-slow (slow.local)\n")
            def log_message(self, format, *args):
                pass
        print("Starting slow backend on :8080 (delay: 200ms)...")
        HTTPServer(('', 8080), DelayedHandler).serve_forever()
    labels:
      - "traffic-proxy.enable=true"
      - "traffic-proxy.rule=slow.local"
      - "traffic-proxy.port=8080"
    networks:
      - local-mesh
