#:schema https://json.schemastore.org/any.json

root = "."
tmp_dir = "tmp"
testdata_dir = "testdata"
env_files = [".env"]

[build]
  cmd = "go build -o ./tmp/traffic-proxy ./cmd/proxy"
  pre_cmd = ["./start.sh --start-backends"]
  bin = "./tmp/traffic-proxy"
  entrypoint = ["./tmp/traffic-proxy"]
  include_dir = ["cmd", "internal", "ui"]
  include_ext = ["go", "html"]
  exclude_dir = ["tmp", "test", "doc", ".agents", ".git"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  kill_delay = "500ms"
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
  keep_scroll = true
